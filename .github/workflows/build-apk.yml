name: 构建APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: 设置 Android SDK 路径
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME/platforms/ 2>/dev/null || echo "无platforms"
          
      - name: 安装 SDK 组件
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -5

      - name: 生成 Gradle Wrapper
        run: |
          cd app
          mkdir -p ../gradle/wrapper
          # 使用 SDK 自带的 gradle
          which gradle 2>/dev/null && gradle wrapper --gradle-version=8.2 || echo "no gradle"

      - name: 构建 Debug APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f gradlew ]; then
            ./gradlew assembleDebug
          else
            cd app
            gradle wrapper --gradle-version=8.2
            cd ..
            ./gradlew assembleDebug
          fi

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoAnswerApp-Debug
          path: app/build/outputs/apk/debug/*.apk
